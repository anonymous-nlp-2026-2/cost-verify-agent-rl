# seed300 step5 in-distribution eval (32 AlfworldSG tasks) — diagnostic for OOD 0.0%
# Single GPU (cuda:0), 1.7B model, thinking disabled

defaults:
  - base

hydra:
  searchpath:
    - pkg://verl.trainer.config

model_path: ./checkpoints/qwen_exp029_seed300_step5_hf

system:
  CUDA_VISIBLE_DEVICES: "0"

micro_batch_size_per_gpu: 1
ppo_mini_batch_size: 16

seed:
  train: 20000
  val: 321

trainer:
  project_name: cost-verify-agent-rl
  experiment_name: seed300-step5-id-eval-diag
  total_training_steps: 1
  n_gpus_per_node: 1
  val_before_train: True
  val_only: True
  test_freq: 999
  save_freq: 999
  local_log_dir: "./checkpoints/seed300-step5-id-diag/"
  default_local_dir: "./checkpoints/seed300-step5-id-diag/"
  logger: ['console', 'wandb']
  max_actor_ckpt_to_keep: 1
  resume_mode: "disable"

actor_rollout_ref:
  model:
    override_config:
      attn_implementation: sdpa
    enable_response_mask: false
  actor:
    use_ref: False
    use_torch_compile: False
    use_kl_loss: False
    kl_loss_coef: 0.0
    entropy_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: "token-mean"
    optim:
      lr: 1e-7
  ref:
    use_torch_compile: False
    log_prob_max_token_len_per_gpu: 65536
  rollout:
    response_length: 1024
    gpu_memory_utilization: 0.5
    enable_chunked_prefill: true
    max_model_len: 20480
    temperature: 1.0
    max_num_batched_tokens: 20480
    enforce_eager: True
    val_kwargs:
      do_sample: True
      temperature: 0.4

algorithm:
  adv_estimator: grpo
  gamma: 0.95
  high_level_gamma: 0.95
  norm_adv_by_std_in_grpo: True

agent_proxy:
  context_window_mode: "full"
  max_context_window: -1
  step_independent_history_length: 2
  max_turn: 50
  max_actions_per_turn: 1
  max_prompt_length: 16384
  use_turn_scores: True
  enable_think: False

collapse_detection:
  multi_turn_enabled: false

es_manager:
  format_penalty: 0
  train:
    env_groups: 16
    group_size: 1
    env_configs:
      tags: ["AlfworldSG"]
      n_groups: [16]
  val:
    env_groups: 32
    group_size: 1
    env_configs:
      tags: ["AlfworldSG"]
      n_groups: [32]
