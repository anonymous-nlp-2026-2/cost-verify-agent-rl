# 8B SFT checkpoint clean eval on in-dist 32 tasks (full context)
# Baseline for comparing RL-trained models
# Target: 2x A6000 48GB

defaults:
  - base

hydra:
  searchpath:
    - pkg://verl.trainer.config

seed:
  train: 42
  val: 123

model_path: ./checkpoints/qwen3_8b_sft_v1/checkpoint-231

system:
  CUDA_VISIBLE_DEVICES: "0,1"

micro_batch_size_per_gpu: 1
ppo_mini_batch_size: 2

trainer:
  project_name: cost-verify-agent-rl
  experiment_name: 8b-sft-clean-eval-indist
  total_training_steps: 1
  n_gpus_per_node: 2
  val_before_train: True
  val_only: True
  test_freq: 999
  save_freq: 999
  local_log_dir: "./checkpoints/8b-sft-clean-eval/"
  default_local_dir: "./checkpoints/8b-sft-clean-eval/"
  logger: ['console', 'wandb']
  max_actor_ckpt_to_keep: 1
  resume_mode: "disable"

actor_rollout_ref:
  model:
    override_config:
      attn_implementation: sdpa
  actor:
    use_ref: False
    use_torch_compile: False
    use_kl_loss: False
    kl_loss_coef: 0.0
    entropy_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: "token-mean"
    optim:
      lr: 1e-7
  ref:
    use_torch_compile: False
  rollout:
    response_length: 1024
    gpu_memory_utilization: 0.45
    enable_chunked_prefill: true
    max_model_len: 20480
    temperature: 1.0
    max_num_batched_tokens: 20480
    enforce_eager: True
    val_kwargs:
      do_sample: True
      temperature: 0.4

algorithm:
  adv_estimator: grpo
  gamma: 0.95
  high_level_gamma: 0.95
  norm_adv_by_std_in_grpo: True

agent_proxy:
  context_window_mode: "full"
  max_context_window: -1
  step_independent_history_length: 2
  max_turn: 50
  max_actions_per_turn: 1
  max_prompt_length: 16384
  use_turn_scores: True
  enable_think: False

collapse_detection:
  multi_turn_enabled: false

es_manager:
  format_penalty: 0
  train:
    env_groups: 1
    group_size: 2
    env_configs:
      tags: ["AlfworldSG"]
      n_groups: [1]
  val:
    env_groups: 32
    group_size: 1
    env_configs:
      tags: ["AlfworldSG"]
      n_groups: [32]
