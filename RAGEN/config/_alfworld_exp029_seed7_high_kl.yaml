defaults:
- base
hydra:
  searchpath:
  - pkg://verl.trainer.config
seed:
  train: 999
  val: 333
model_path: ./checkpoints/qwen3_exp021_ragen_sft_v4
system:
  CUDA_VISIBLE_DEVICES: 0,1
micro_batch_size_per_gpu: 1
ppo_mini_batch_size: 16
trainer:
  project_name: cost-verify-agent-rl
  experiment_name: exp029-seed7-high-kl
  total_training_steps: 7
  n_gpus_per_node: 2
  val_before_train: true
  test_freq: 5
  save_freq: 5
  local_log_dir: ./checkpoints/exp029-seed7-high-kl/
  default_local_dir: ./checkpoints/exp029-seed7-high-kl/
  logger:
  - console
  - wandb
  max_actor_ckpt_to_keep: 2
  resume_mode: disable
actor_rollout_ref:
  model:
    override_config:
      attn_implementation: sdpa
    enable_gradient_checkpointing: true
  actor:
    fsdp_config:
      optimizer_offload: false
    use_ref: true
    use_torch_compile: false
    use_kl_loss: true
    kl_loss_coef: 0.1
    kl_loss_type: low_var_kl
    entropy_coeff: 0.001
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: token-mean
    grad_clip: 1.0
    ppo_max_token_len_per_gpu: 65536
    optim:
      lr: 1e-6
  ref:
    use_torch_compile: false
    log_prob_max_token_len_per_gpu: 65536
  rollout:
    response_length: 1024
    gpu_memory_utilization: 0.35
    enable_chunked_prefill: true
    max_model_len: 20480
    temperature: 1.0
    max_num_batched_tokens: 20480
    enforce_eager: true
    val_kwargs:
      do_sample: true
      temperature: 0.4
algorithm:
  adv_estimator: grpo
  gamma: 0.95
  high_level_gamma: 0.95
  norm_adv_by_std_in_grpo: true
agent_proxy:
  context_window_mode: full
  max_context_window: -1
  step_independent_history_length: 2
  max_turn: 50
  max_actions_per_turn: 1
  max_prompt_length: 16384
  use_turn_scores: true
collapse_detection:
  multi_turn_enabled: false
es_manager:
  format_penalty: 0
  train:
    env_groups: 16
    group_size: 8
    env_configs:
      tags:
      - AlfworldSG
      n_groups:
      - 16
  val:
    env_groups: 32
    group_size: 1
    env_configs:
      tags:
      - AlfworldSG
      n_groups:
      - 32
