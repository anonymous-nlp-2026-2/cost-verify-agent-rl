# exp028a: Penalty Verification (Control Group) — Single GPU cuda:0
# 基于 exp027，变更：
#   n_gpus_per_node: 2→1（单卡）
#   invalid_action_penalty_coef: 0→0.1（显式启用，解决零梯度）
#   ppo_mini_batch_size: 32→8
# 对照组：与 exp028b 唯一差异是 ppo_mini_batch_size (8 vs 32)

defaults:
  - base

hydra:
  searchpath:
    - pkg://verl.trainer.config

model_path: ./checkpoints/qwen3_exp021_ragen_sft_v4

system:
  CUDA_VISIBLE_DEVICES: "0"

micro_batch_size_per_gpu: 1
ppo_mini_batch_size: 8

trainer:
  project_name: cost-verify-agent-rl
  experiment_name: exp028a-penalty
  total_training_steps: 50
  n_gpus_per_node: 1
  val_before_train: True
  test_freq: 5
  save_freq: 5
  local_log_dir: "./checkpoints/exp028a/"
  default_local_dir: "./checkpoints/exp028a/"
  logger: ['console', 'wandb']
  max_actor_ckpt_to_keep: 10
  resume_mode: "disable"

actor_rollout_ref:
  model:
    override_config:
      attn_implementation: sdpa
  actor:
    use_ref: True
    use_torch_compile: False
    use_kl_loss: True
    kl_loss_coef: 0.005
    kl_loss_type: low_var_kl
    entropy_coeff: 0.01
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    loss_agg_mode: "seq-mean-token-mean"
    grad_clip: 1.0
    optim:
      lr: 5e-7
  ref:
    use_torch_compile: False
  rollout:
    response_length: 1024
    gpu_memory_utilization: 0.4
    max_model_len: 8192
    temperature: 1.0
    max_num_batched_tokens: 8192
    enforce_eager: True
    val_kwargs:
      do_sample: True
      temperature: 0.4

algorithm:
  adv_estimator: grpo
  gamma: 0.95
  high_level_gamma: 0.95
  norm_adv_by_std_in_grpo: True
  invalid_action_penalty_coef: 0.1

agent_proxy:
  context_window_mode: "step_independent"
  max_context_window: 5
  step_independent_history_length: 5
  max_turn: 50
  max_actions_per_turn: 1
  max_prompt_length: 4096
  use_turn_scores: True

collapse_detection:
  multi_turn_enabled: false

es_manager:
  format_penalty: 0
  train:
    env_groups: 8
    group_size: 16
    env_configs:
      tags: ["AlfworldSG"]
      n_groups: [8]
  val:
    env_groups: 16
    group_size: 1
    env_configs:
      tags: ["AlfworldSG"]
      n_groups: [16]
