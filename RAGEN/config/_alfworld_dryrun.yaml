defaults:
  - base

hydra:
  searchpath:
    - pkg://verl.trainer.config

model_path: ./models/Qwen3-1.7B

system:
  CUDA_VISIBLE_DEVICES: "0,1"

micro_batch_size_per_gpu: 1
ppo_mini_batch_size: 8

trainer:
  experiment_name: alfworld-dryrun
  total_training_steps: 2
  n_gpus_per_node: 2
  val_before_train: False
  logger: ['console']
  save_freq: -1

actor_rollout_ref:
  model:
    override_config:
      attn_implementation: sdpa
  actor:
    use_ref: True
    use_torch_compile: False
    loss_agg_mode: "seq-mean-token-mean"
  ref:
    use_torch_compile: False
  rollout:
    response_length: 512
    gpu_memory_utilization: 0.3
    max_model_len: 4096
    temperature: 1.0
    enforce_eager: True

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: True

agent_proxy:
  max_turn: 10
  max_actions_per_turn: 1

es_manager:
  format_penalty: -0.1
  train:
    env_groups: 2
    group_size: 4
    env_configs:
      tags: ["Alfworld"]
      n_groups: [2]
  val:
    env_groups: 2
    group_size: 1
    env_configs:
      tags: ["Alfworld"]
      n_groups: [2]
