defaults:
  - base

hydra:
  searchpath:
    - pkg://verl.trainer.config

model_path: ./models/Qwen3-1.7B

system:
  CUDA_VISIBLE_DEVICES: "0,1"

micro_batch_size_per_gpu: 1
ppo_mini_batch_size: 16

trainer:
  project_name: cost-verify-agent-rl
  experiment_name: exp001-alfworld-sg-always-on
  total_training_steps: 50
  n_gpus_per_node: 2
  val_before_train: True
  test_freq: 10
  save_freq: 10
  local_log_dir: "./checkpoints/exp_001/"
  logger: ['console']
  max_actor_ckpt_to_keep: 3

actor_rollout_ref:
  model:
    override_config:
      attn_implementation: sdpa
  actor:
    use_ref: True
    use_torch_compile: False
    loss_agg_mode: "seq-mean-token-mean"
  ref:
    use_torch_compile: False
  rollout:
    response_length: 512
    gpu_memory_utilization: 0.3
    max_model_len: 16384
    temperature: 1.0
    enforce_eager: True

algorithm:
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: True

agent_proxy:
  max_turn: 10
  max_actions_per_turn: 1

es_manager:
  format_penalty: -0.1
  train:
    env_groups: 4
    group_size: 4
    env_configs:
      tags: ["AlfworldSG"]
      n_groups: [4]
  val:
    env_groups: 8
    group_size: 1
    env_configs:
      tags: ["AlfworldSG"]
      n_groups: [8]
